name: Print PR Modified Files

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request number"
        required: true
        type: number   # ← important (number type sometimes passes empty)

jobs:
  list-pr-files:
    runs-on: ubuntu-latest

    steps:
      - name: Get modified files in PR
        id: get-files   # ← REQUIRED
        uses: actions/github-script@v8
        with:
          script: |
            const prInput = core.getInput('pr_number');

            if (!prInput) {
              core.setFailed("pr_number input missing");
              return;
            }

            const prNumber = Number(prInput);

            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed(`Invalid PR number: ${prInput}`);
              return;
            }

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              }
            );

            const fileList = files.map(f => f.filename);

            core.info(`PR #${prNumber} modified files:\n${fileList.join("\n")}`);
            core.setOutput("files", fileList.join("\n"));

      - name: Print files
        run: |
          echo "Modified files:"
          echo "${{ steps.get-files.outputs.files }}"