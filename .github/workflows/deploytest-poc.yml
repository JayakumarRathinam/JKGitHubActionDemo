
name: List PR Files (gh)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request Number"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Show inputs
        run: |
          echo "PR number: ${{ inputs.pr_number }}"

      - name: List files using gh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            owner="${{ github.repository_owner }}"
            repo="${{ github.event.repository.name }}"
            pr="${{ inputs.pr_number }}"

            changed_lines=$(
              gh pr view "$pr" --repo "$owner/$repo" --json files \
                --jq '.files[] | [.path, .additions, .deletions] | @tsv' \
              | awk -F'\t' '{printf "modified  %s (+%s/-%s)\n", $1, $2, $3}'
            )

            # Use it later:
            echo "Changed lines:"
            printf '%s\n' "$changed_lines"
