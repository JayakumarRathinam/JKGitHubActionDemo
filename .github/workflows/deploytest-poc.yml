name: List PR Changed Files (by PR Number)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request Number to inspect"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

jobs:
  list-pr-files:
    runs-on: ubuntu-latest
    steps:
      - name: Show inputs
        run: |
          echo "PR number: ${{ inputs.pr_number }}"

      - name: List changed files for PR
        id: list_files
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = Number(core.getInput('pr_number', { required: true }));
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            core.info(`Fetching changed files for ${owner}/${repo} PR #${prNumber} ...`);

            const files = [];
            const per_page = 100;
            for await (const response of github.paginate.iterator(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number: prNumber, per_page }
            )) {
              for (const f of response.data) {
                files.push({
                  filename: f.filename,
                  status: f.status,         // added | modified | removed | renamed
                  additions: f.additions,
                  deletions: f.deletions,
                  changes: f.changes,
                  previous_filename: f.previous_filename || ''
                });
              }
            }

            if (files.length === 0) {
              core.warning('No changed files found (PR may not exist or has no changes).');
            } else {
              core.info('--- Changed files ---');
              for (const f of files) {
                core.info(`${f.status.padEnd(8)} ${f.filename}` + (f.previous_filename ? `  (from: ${f.previous_filename})` : ''));
              }
              core.info('---------------------');
            }

            // Set outputs (you can consume them in later steps)
            core.setOutput('count', String(files.length));
            core.setOutput('filenames_newline', files.map(f => f.filename).join('\n'));
            core.setOutput('filenames_json', JSON.stringify(files));

      - name: Print summary
        run: |
          echo "Changed file count: ${{ steps.list_files.outputs.count }}"
          echo "Files:"
          echo "${{ steps.list_files.outputs.filenames_newline }}"