name: Print PR Modified Files

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request number"
        required: true
        type: number

jobs:
  list-pr-files:
    runs-on: ubuntu-latest

    steps:
      - name: Get modified files in PR
        uses: actions/github-script@v8
        with:
          script: |
            const prNumber = Number(core.getInput('pr_number'));

            if (!prNumber || prNumber <= 0) {
              core.setFailed(`Invalid PR number: ${prNumber}`);
              return;
            }

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              }
            );

            const fileList = files.map(f => f.filename);

            core.info(`PR #${prNumber} modified files:\n${fileList.join("\n")}`);
            core.setOutput("files", fileList.join("\n"));

      - name: Print files
        run: |
          echo "Modified files:"
          echo "${{ steps.get-files.outputs.files }}"