name: List PR Files (curl)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request Number"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List files via REST
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          echo "Fetching changed files for $OWNER/$REPO PR #$PR_NUMBER ..."

          page=1
          per_page=100
          total=0
          while : ; do
            resp=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                        -H "Accept: application/vnd.github+json" \
                        "https://api.github.com/repos/$OWNER/$REPO/pulls/$PR_NUMBER/files?per_page=$per_page&page=$page")

            count=$(echo "$resp" | jq 'length')
            if [ "$count" -eq 0 ]; then break; fi

            echo "$resp" | jq -r '.[] | "\(.status)\t\(.filename)\t\(.additions)\t\(.deletions)\t\(.previous_filename // "")"' \
              | awk -F'\t' '{printf "%-8s %s (+%s/-%s)%s\n", $1, $2, $3, $4, ($5 != "" ? " (from: " $5 ")" : "")}'

            total=$((total + count))
            page=$((page + 1))
          done

          echo "Total files: $total"