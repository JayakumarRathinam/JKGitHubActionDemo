name: Deploytest_POC

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request number to deploy"
        required: true
        type: string

      FullDeploy:
        description: "Do you want fullcode Deployment"
        required: true
        type: boolean
        default: false

jobs:
  workflow-trigger:
    if: github.event_name == 'workflow_dispatch'     
    runs-on: ubuntu-latest
    steps:
      - name: Workflow Triggered
        run: echo "✅ workflow triggered successfully"

  deploy-test:
    name: Deploy to OZ TEST
    strategy: 
        fail-fast: false
        matrix:
          python-version: [3.11.13]
          poetry-version: [2.1.3]
          os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6.0.2
      # PR checkout when incremental PR deploy
      - name: Checkout PR branch
        if: inputs.pr_number != '' && !inputs.FullDeploy
        uses: actions/checkout@v6.0.2
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          fetch-depth: 0
      # Get PR changed files
      - uses: actions/github-script@v8
        with:
          script: |
            const prInput = core.getInput('pr_number');
            if (!prInput) {
              core.setFailed("pr_number input is required");
              return;
            }

            const prNumber = Number(prInput);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed(`Invalid PR number: ${prInput}`);
              return;
            }

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner: context.repo.owner, repo: context.repo.repo, pull_number: prNumber }
            );

            core.setOutput("files", files.map(f => f.filename).join("\n"));
      # ============================================
      # Deploy step (PR incremental OR full main)
      # ============================================
      - name: Deploy Yaml config to dbfs
        run: |
          set -euo pipefail

          DBFS_BASE="dbfs:/code/dbx/hedis_de/dependencies"
          EXCLUDES_FILE="excludeindeploy.txt"
          TEMP_DIR="/tmp/workspace_clean"

          # --------------------------------------------------
          # PR incremental deploy
          # --------------------------------------------------
          if [[ -n "${{ inputs.pr_number }}" && "${{ inputs.FullDeploy }}" != "true" ]]; then
            echo "📦 Deploying PR incremental changes"

            CHANGED_FILES="${{ steps.pr_files.outputs.files }}"

            if [[ -n "$CHANGED_FILES" ]]; then
              IFS=$'\n'
              for file in $CHANGED_FILES; do
                SRC="$GITHUB_WORKSPACE/$file"
                DEST="$DBFS_BASE/$file"

                if [[ -e "$SRC" ]]; then
                  echo "➡️ Copying: $file"
                  # poetry run databricks fs mkdirs "$(dirname "$DEST")" || true
                  # poetry run databricks fs cp -r "$SRC" "$DEST" --overwrite
                  # echo "✅ $file deployed"
                else
                  echo "⚠️ Missing in PR workspace: $file"
                fi
              done
            else
              echo "⚠️ No changed files detected in PR"
            fi

          # --------------------------------------------------
          # Full deploy from main
          # --------------------------------------------------
          else
            echo "🚀 Full deploy from main branch"

            git fetch origin main --quiet
            git checkout origin/main --quiet

            rm -rf "$TEMP_DIR"
            mkdir -p "$TEMP_DIR"
            cp -r "$GITHUB_WORKSPACE/." "$TEMP_DIR/"

            mapfile -t EXCLUDES < "$EXCLUDES_FILE"
            for ex in "${EXCLUDES[@]}"; do
              [[ -n "$ex" ]] || continue
              [[ "$ex" =~ ^# ]] && continue
              TARGET="$TEMP_DIR/$ex"
              [[ -e "$TARGET" ]] && rm -rf "$TARGET"
            done

            # poetry run databricks fs rm -r "$DBFS_BASE" || true
            # poetry run databricks fs mkdirs "$DBFS_BASE"
            # poetry run databricks fs cp -r "$TEMP_DIR/" "$DBFS_BASE" --overwrite

            TOTAL_COPIED=$(find "$TEMP_DIR" -type f | wc -l)
            echo "✅ Full deploy completed — files: $TOTAL_COPIED"
          fi
