name: Branch Name Validation

on:
  create:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check branch name format
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Checking branch: $BRANCH"

          # ✅ Exclude branches
          if [[ "$BRANCH" == "main" || "$BRANCH" == "development" ]]; then
            echo "✅ Skipping validation for protected branch: $BRANCH"
            exit 0
          fi

          # ✅ Regex validation
          if [[ ! "$BRANCH" =~ ^(us[0-9]{6,}|r[0-9]{6,}|fb[0-9]{6,}|hb[0-9]{6,})(-tk[0-9]{6,})?(-[a-z0-9-]+)+$ ]]; then
            echo "❌ Invalid branch name!"
            exit 1
          fi

          echo "✅ Valid branch name"
